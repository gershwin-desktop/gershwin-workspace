name: Build Gershwin Workspace

# Build gershwin-workspace against the real Gershwin stack by reusing
# gershwin-developer: build the core libraries once ("make corelibs"), then
# build the checkout under test ("make workspace"). The workspace sources are
# provided by this repo's checkout via a symlink, and SKIP_REPOS keeps
# Checkout.sh from cloning gershwin-workspace itself or any sibling apps that
# are not needed to build the core libraries.

on:
  push:
    branches: [main, dev, windows]
  pull_request:
  workflow_dispatch:

env:
  # Dev channel.  When this run is "for dev" -- the branch pushed is dev, the PR
  # head is dev, or the PR targets dev -- we build against the dev side of the
  # whole stack: gershwin-developer is cloned at its dev branch, and BRANCH=dev
  # is handed to checkout.sh so every Gershwin repo that HAS a dev branch is
  # used at dev (repos without one silently fall back to their default branch).
  # gershwin-developer's dev checkout.sh auto-detects a dev run and does this by
  # itself, but only its dev copy does -- and a repo like this one clones
  # gershwin-developer, so before this change it got the main copy, which has no
  # such detection.  Cloning developer at dev is therefore the half that brings
  # the dev-aware scaffolding in, and setting BRANCH explicitly is the half that
  # makes the dev channel a property of this workflow rather than an implicit
  # behaviour of whichever checkout.sh we happen to have cloned.
  # For main, master, or any other branch this is empty, which is identical to
  # not setting it at all -- those builds behave exactly as they did before.
  # The windows branch builds against gershwin-developer's windows branch
  # (which carries dev plus the Windows support), so the Unix builds there
  # also cover the developer-side changes.
  BRANCH: ${{ (github.ref_name == 'dev' || github.head_ref == 'dev' || github.base_ref == 'dev') && 'dev' || (github.ref_name == 'windows' && 'windows' || '') }}

  # Repos Checkout.sh should NOT clone:
  #   - gershwin-workspace      -> provided by this repo's checkout (symlinked)
  #   - the sibling apps        -> not needed to build corelibs + workspace
  # Everything else (libdispatch, libobjc2, tools-make, libs-base/gui/back,
  # gershwin-system, gershwin-components, gershwin-assets) is still cloned.
  # NOTE: gershwin-systempreferences is deliberately NOT skipped.  The
  # workspace MDIndexing prefPane links the PreferencePanes framework it
  # installs; without it <PreferencePanes/PreferencePanes.h> is not found and
  # the workspace build fails.  It is cloned here and built (via the
  # workspace target, which builds systempreferences first) before workspace.
  SKIP_REPOS: >-
    gershwin-workspace
    gershwin-eau-theme
    gershwin-terminal
    gershwin-textedit
    gershwin-windowmanager

jobs:
  build-freebsd-14-amd64:
    name: FreeBSD x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: gershwin-workspace

      - name: Build workspace inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          usesh: true
          sync: rsync
          copyback: false
          cpu: 2
          mem: 4096
          prepare: |
            pkg update
            pkg install -y git xorg-vfbserver
          run: |
            set -e
            BASE="$(pwd)"
            # Empty unless this is a dev run; see the BRANCH comment at the top.
            BRANCH="${{ env.BRANCH }}"
            git clone --depth 1 ${BRANCH:+--branch "$BRANCH"} https://github.com/gershwin-desktop/gershwin-developer.git
            cd "$BASE/gershwin-developer"
            ./Library/Scripts/bootstrap.sh
            SKIP_REPOS="${{ env.SKIP_REPOS }}" BRANCH="$BRANCH" ./Library/Scripts/checkout.sh
            ln -sfn "$BASE/gershwin-workspace" Library/Sources/gershwin-workspace
            make corelibs
            make workspace
            # The unit suites run against what make workspace installed.
            sh "$BASE/gershwin-workspace/Tests/ci-install-gershwin-fonts.sh" "$PWD"
            sh "$BASE/gershwin-workspace/Tests/run-suites.sh"
            # Multi-monitor checks on a private Xorg with the dummy driver
            # (16 RandR outputs); the script picks a free display from :200.
            pkg install -y xorg-server xf86-video-dummy xrandr xwininfo xdpyinfo
            MULTIHEAD_REQUIRE=1 sh "$BASE/gershwin-workspace/Tests/run-multihead.sh"

  build-archlinux-x86_64:
    name: Arch x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: archlinux:latest
    steps:
      - name: Install git
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git

      - uses: actions/checkout@v4
        with:
          path: gershwin-workspace

      - name: Clone gershwin-developer
        # $BRANCH comes from the workflow env above: "dev" on a dev run, empty
        # otherwise, in which case this is the plain default-branch clone.
        run: git clone --depth 1 ${BRANCH:+--branch "$BRANCH"} https://github.com/gershwin-desktop/gershwin-developer.git

      - name: Bootstrap
        working-directory: gershwin-developer
        run: ./Library/Scripts/bootstrap.sh

      - name: Checkout sources (skip workspace and sibling apps)
        working-directory: gershwin-developer
        # SKIP_REPOS and BRANCH are both inherited from the workflow env above.
        run: ./Library/Scripts/checkout.sh

      - name: Link workspace source under test
        working-directory: gershwin-developer
        run: ln -sfn "$GITHUB_WORKSPACE/gershwin-workspace" Library/Sources/gershwin-workspace

      - name: Build core libraries
        working-directory: gershwin-developer
        run: make corelibs

      - name: Build workspace
        working-directory: gershwin-developer
        run: make workspace

      - name: Run the unit suites
        # Each Tests/ directory with a TestInfo marker, against the installed
        # build, on a private Xvfb started by the script.
        run: |
          pacman -S --noconfirm xorg-server-xvfb
          sh gershwin-workspace/Tests/ci-install-gershwin-fonts.sh gershwin-developer
          sh gershwin-workspace/Tests/run-suites.sh

      - name: Multi-monitor tests (Xorg dummy driver)
        # Desktop suites and a live unplug check on a private Xorg with 16
        # RandR outputs; see gershwin-workspace/Tests/run-multihead.sh.  The
        # fonts were installed by the step above.
        run: |
          pacman -S --noconfirm xorg-server xf86-video-dummy xorg-xrandr xorg-xwininfo xorg-xdpyinfo
          MULTIHEAD_REQUIRE=1 MULTIHEAD_KEEP="$GITHUB_WORKSPACE/multihead-logs" \
            sh gershwin-workspace/Tests/run-multihead.sh

      - name: Upload multi-monitor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multihead-logs-archlinux-x86_64
          path: multihead-logs
          if-no-files-found: ignore

  build-debian-x86_64:
    name: Debian x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: debian:bookworm
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get -y install git

      - uses: actions/checkout@v4
        with:
          path: gershwin-workspace

      - name: Clone gershwin-developer
        # $BRANCH comes from the workflow env above: "dev" on a dev run, empty
        # otherwise, in which case this is the plain default-branch clone.
        run: git clone --depth 1 ${BRANCH:+--branch "$BRANCH"} https://github.com/gershwin-desktop/gershwin-developer.git

      - name: Bootstrap
        working-directory: gershwin-developer
        run: ./Library/Scripts/bootstrap.sh

      - name: Checkout sources (skip workspace and sibling apps)
        working-directory: gershwin-developer
        # SKIP_REPOS and BRANCH are both inherited from the workflow env above.
        run: ./Library/Scripts/checkout.sh

      - name: Link workspace source under test
        working-directory: gershwin-developer
        run: ln -sfn "$GITHUB_WORKSPACE/gershwin-workspace" Library/Sources/gershwin-workspace

      - name: Build core libraries
        working-directory: gershwin-developer
        run: make corelibs

      - name: Build workspace
        working-directory: gershwin-developer
        run: make workspace

      - name: Run the unit suites
        # Each Tests/ directory with a TestInfo marker, against the installed
        # build, on a private Xvfb started by the script.
        run: |
          apt-get -y install xvfb
          sh gershwin-workspace/Tests/ci-install-gershwin-fonts.sh gershwin-developer
          sh gershwin-workspace/Tests/run-suites.sh

      - name: Multi-monitor tests (Xorg dummy driver)
        # Desktop suites and a live unplug check on a private Xorg with 16
        # RandR outputs; see gershwin-workspace/Tests/run-multihead.sh.  The
        # fonts were installed by the step above.
        run: |
          apt-get -y install xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils x11-utils
          MULTIHEAD_REQUIRE=1 MULTIHEAD_KEEP="$GITHUB_WORKSPACE/multihead-logs" \
            sh gershwin-workspace/Tests/run-multihead.sh

      - name: Upload multi-monitor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multihead-logs-debian-x86_64
          path: multihead-logs
          if-no-files-found: ignore

  build-openbsd-78-amd64:
    name: OpenBSD x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: gershwin-workspace

      - name: Build workspace inside OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.8"
          usesh: true
          sync: rsync
          copyback: false
          cpu: 2
          mem: 4096
          prepare: |
            # pkg_add searches each PKG_PATH location in order. Using several
            # mirrors keeps the job working through transient cdn.openbsd.org
            # outages (which previously left gmake uninstalled and aborted
            # "make corelibs" with "gmake: not found").
            export PKG_PATH="https://ftp.openbsd.org/pub/OpenBSD/%v/packages/%a/:https://mirrors.gigenet.com/pub/OpenBSD/%v/packages/%a/:https://cdn.openbsd.org/pub/OpenBSD/%v/packages/%a/"
            for i in 1 2 3 4 5; do
              pkg_add -I git && exit 0
              echo "pkg_add git failed (attempt $i), retrying..."
              sleep 15
            done
            exit 1
          run: |
            set -e
            BASE="$(pwd)"
            # Xvfb for the unit suites comes with the xserv set.
            export PATH="$PATH:/usr/X11R6/bin"
            export PKG_PATH="https://ftp.openbsd.org/pub/OpenBSD/%v/packages/%a/:https://mirrors.gigenet.com/pub/OpenBSD/%v/packages/%a/:https://cdn.openbsd.org/pub/OpenBSD/%v/packages/%a/"
            # Empty unless this is a dev run; see the BRANCH comment at the top.
            BRANCH="${{ env.BRANCH }}"
            git clone --depth 1 ${BRANCH:+--branch "$BRANCH"} https://github.com/gershwin-desktop/gershwin-developer.git
            cd "$BASE/gershwin-developer"
            ./Library/Scripts/bootstrap.sh
            # bootstrap.sh tolerates per-package pkg_add failures, so a transient
            # mirror outage can leave required build tools missing. Verify the
            # critical ones and retry to ride out mirror flakiness.
            for i in 1 2 3 4 5; do
              command -v gmake >/dev/null 2>&1 && break
              echo "gmake missing after bootstrap (attempt $i), retrying pkg_add..."
              pkg_add -I gmake || true
              sleep 15
            done
            command -v gmake >/dev/null 2>&1 || { echo "FATAL: gmake not installed"; exit 1; }
            SKIP_REPOS="${{ env.SKIP_REPOS }}" BRANCH="$BRANCH" ./Library/Scripts/checkout.sh
            ln -sfn "$BASE/gershwin-workspace" Library/Sources/gershwin-workspace
            make corelibs
            make workspace
            # The unit suites run against what make workspace installed.
            sh "$BASE/gershwin-workspace/Tests/ci-install-gershwin-fonts.sh" "$PWD"
            sh "$BASE/gershwin-workspace/Tests/run-suites.sh"
            # Multi-monitor tests are not run here: they need a private Xorg
            # with the dummy video driver, and it is not known to be installed
            # in this image.  Run Tests/run-multihead.sh once it is.
            echo "SKIP multi-monitor tests: no Xorg dummy video driver verified on OpenBSD"
